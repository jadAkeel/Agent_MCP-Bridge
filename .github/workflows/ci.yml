name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # Minimum supported SQLite API plus maintained Node LTS lines.
        node: [22.13.0, 22.x, 24.x]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # The runner has no OpenCode CLI, no Codex config and no live bridge: cases that need
      # them warn instead of failing. The skip summary at the end of npm test lists them.
      CODEX_TEST_ALLOW_REQUIRED_SKIPS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Several suites create commits in temporary repositories.
      - name: Configure git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global core.autocrlf false

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - run: npm run test:platform

      - name: Diagnose isolated Windows process inspection
        if: runner.os == 'Windows'
        run: node bin/verify-isolated.js --node tests/ci-process-probe.js

      # No installed providers, personal profiles, credentials or inference. The
      # wrapper canonicalizes macOS /var temporary aliases rather than relaxing
      # installer/release link checks. npm test keeps its existing skip ledger.
      - run: node bin/verify-isolated.js --node tests/platform-suite.js

      - name: Preserve native verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-node-${{ matrix.node }}
          path: .test-logs/
          include-hidden-files: true
